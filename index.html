<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSFW Chatbot Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #2c2c2c; color: white; }
        .chat-container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .message { margin-bottom: 10px; padding: 10px; border-radius: 10px; }
        .user { background-color: #007bff; text-align: right; }
        .bot { background-color: #dc3545; }
        .character-select { margin-bottom: 20px; }
        .generated-image { max-width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container chat-container">
        <h1 class="text-center">NSFW Chatbot Hub</h1>
        <p class="text-center">Select a character and start chatting. Bots will generate sexy images!</p>
        
        <div class="character-select">
            <label for="character">Choose a Character:</label>
            <select id="character" class="form-select">
                <option value="mommy">Mommy</option>
                <option value="gf">Girlfriend (GF)</option>
                <option value="neighbor">Seductive Neighbor</option>
                <option value="waifu">Hentai Waifu</option>
            </select>
        </div>
        
        <div id="chat-box" class="border p-3" style="height: 400px; overflow-y: scroll;"></div>
        
        <div class="input-group mt-3">
            <input type="text" id="user-input" class="form-control" placeholder="Type your message...">
            <button id="send-btn" class="btn btn-primary">Send</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // Character responses and prompts
        const characters = {
            mommy: {
                responses: [
                    "Oh, sweetie, come here and let Mommy take care of you. What naughty thoughts are in your mind?",
                    "Mommy loves seeing you excited. Tell me more, and I'll make it even hotter.",
                    "Mmm, you're such a good boy. Imagine Mommy in lingerie... want an image?"
                ],
                imagePrompt: "sexy mature woman as mommy in hentai style, nude, sensual pose, high detail"
            },
            gf: {
                responses: [
                    "Hey babe, I've been thinking about you all day. What do you want to do tonight?",
                    "You're so hot when you're flirty. Let's get steamy – describe it to me.",
                    "GF mode activated: Full nude selfie coming up if you ask nicely!"
                ],
                imagePrompt: "sexy girlfriend nude in bedroom, realistic style, erotic pose, high resolution"
            },
            neighbor: {
                responses: [
                    "Psst, neighbor, I've been watching you. Want to come over for some fun?",
                    "Shh, don't tell anyone. Let's make this our little secret.",
                    "Oh, you're bold! Here's a peek at what I have in store."
                ],
                imagePrompt: "seductive neighbor woman nude, hentai anime style, provocative pose, detailed"
            },
            waifu: {
                responses: [
                    "Kawaii desu! Your waifu is here to fulfill your fantasies.",
                    "Ara ara, what do you desire, master? More hentai vibes?",
                    "Let's get lewd! Imagine me in all my glory."
                ],
                imagePrompt: "hentai waifu girl fully nude, exaggerated curves, anime style, sensual expression"
            }
        };

        let currentCharacter = 'mommy';

        $('#character').change(function() {
            currentCharacter = $(this).val();
            $('#chat-box').append('<div class="message bot">Switched to ' + currentCharacter + ' mode. Hello!</div>');
        });

        $('#send-btn').click(function() {
            const userMessage = $('#user-input').val().trim();
            if (!userMessage) return;
            
            $('#chat-box').append('<div class="message user">' + userMessage + '</div>');
            $('#user-input').val('');
            
            // Bot response
            const responses = characters[currentCharacter].responses;
            const randomResponse = responses[Math.floor(Math.random() * responses.length)];
            setTimeout(() => {
                $('#chat-box').append('<div class="message bot">' + randomResponse + '</div>');
                
                // Generate image if message contains keywords like "image", "nude", "sexy"
                if (userMessage.toLowerCase().includes('image') || userMessage.toLowerCase().includes('nude') || userMessage.toLowerCase().includes('sexy')) {
                    generateImage(characters[currentCharacter].imagePrompt);
                }
            }, 1000);
        });

        function generateImage(prompt) {
            // Using DeepAI API (free credits, requires API key)
            const apiKey = '4b643cdc-850a-45b2-818c-36e7bd28fcc1'; // Your provided API key
            const apiUrl = 'https://api.deepai.org/api/text2img';
            
            $.ajax({
                url: apiUrl,
                method: 'POST',
                headers: {
                    'Api-Key': apiKey
                },
                data: { text: prompt },
                success: function(data) {
                    if (data.output_url) {
                        $('#chat-box').append('<div class="message bot"><img src="' + data.output_url + '" class="generated-image" alt="Generated Image"></div>');
                    } else {
                        $('#chat-box').append('<div class="message bot">Image generation failed. Check credits or prompt.</div>');
                    }
                },
                error: function(xhr) {
                    const errorMsg = xhr.responseJSON ? xhr.responseJSON.error : 'Unknown error';
                    $('#chat-box').append('<div class="message bot">API Error: ' + errorMsg + '. Check key or credits.</div>');
                }
            });
        }
    </script>
</body>
</html>
